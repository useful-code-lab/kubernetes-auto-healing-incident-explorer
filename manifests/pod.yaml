apiVersion: v1
kind: Pod
metadata:
  name: kube-source-explorer
spec:
  serviceAccountName: staging-demo-sa
  containers:
    - name: explorer
      image: kube-source-explorer:latest
      imagePullPolicy: Never # Чтобы использовать локальный образ
      command: ["/app"]      # явно указываем путь к бинарнику
      args: ["events"]        # аргументы к /app