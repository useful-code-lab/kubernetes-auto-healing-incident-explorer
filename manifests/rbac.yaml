apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-demo-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: staging-demo-role
rules:
- apiGroups: [""]
  # Добавляем ресурсы, к которым обращаемся через staging/client-go
  resources: ["pods",  "pods/log", "events", "nodes", "namespaces", "deployments"]
  # Разрешаем смотреть (watch) и перечислять (list)
  verbs: ["get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: staging-demo-binding
subjects:
  - kind: ServiceAccount
    name: staging-demo-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: staging-demo-role # Используем нашу новую роль вместо стандартной view
  apiGroup: rbac.authorization.k8s.io
