apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-demo-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: staging-demo-binding
subjects:
  - kind: ServiceAccount
    name: staging-demo-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
