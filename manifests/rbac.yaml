apiVersion: v1
kind: ServiceAccount
metadata:
  name: staging-demo-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: staging-demo-role
rules:
  # 1. Группа "" (Core): здесь живут Поды и События
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces"]
    verbs: ["get", "list", "watch", "delete"]

  # 2. Группа "apps": здесь живут Deployments и ReplicaSets
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: staging-demo-binding
subjects:
  - kind: ServiceAccount
    name: staging-demo-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: staging-demo-role
  apiGroup: rbac.authorization.k8s.io
